name: Verificações e GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-e-construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Base real do repositório (nome: fitnez); build, e2e e artefato usam a mesma.
      VITE_BASE_PATH: /fitnez/
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Verificar dependências conhecidas
        run: npm audit --audit-level=moderate
      - name: Verificar tipos, testes e artefato
        run: npm run check
      - name: Instalar Chromium de teste
        run: npx playwright install --with-deps chromium
      - name: Testar fluxos e modo offline no navegador
        run: npm run test:e2e
      - name: Guardar relatório e traces do Playwright
        # Também roda quando o teste passou só na repetição (instável); só dados sintéticos de teste.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidencia
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enviar somente dist
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    # Trava: só publica com a variável de repositório PUBLICAR_PAGES = 'true'.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
    needs: verificar-e-construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato verificado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
