<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino 12 semanas</title>
<meta name="theme-color" content="#13203B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface2:#F3F5F9; --ink:#13203B; --muted:#56657F; --line:#D3DAE6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FC;
  --ok:#17825A; --ok-soft:#DCF2E7; --amber:#8A5200; --amber-soft:#FAE9C6; --red:#D1243B; --red-soft:#FBE3E6;
  --font-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#131F36; --surface2:#1A2845; --ink:#EAF0FF; --muted:#9AA9C9; --line:#263759;
    --accent:#7C9CFF; --accent-ink:#0B1322; --accent-soft:#1E2F5C;
    --ok:#4CC38A; --ok-soft:#14352A; --amber:#F2B94B; --amber-soft:#3A2D0E; --red:#F0586B; --red-soft:#3C1A22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#131F36; --surface2:#1A2845; --ink:#EAF0FF; --muted:#9AA9C9; --line:#263759;
  --accent:#7C9CFF; --accent-ink:#0B1322; --accent-soft:#1E2F5C;
  --ok:#4CC38A; --ok-soft:#14352A; --amber:#F2B94B; --amber-soft:#3A2D0E; --red:#F0586B; --red-soft:#3C1A22;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:18px 16px 160px}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:.005em;margin:0;line-height:1.02}
h1{font-size:40px}
h2{font-size:28px}
h3{font-size:22px}
p{margin:0}
.lead{color:var(--muted);margin-top:6px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* faixa de progresso */
.belt{display:flex;gap:3px;height:16px;margin:16px 0 6px}
.seg{flex:1;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--accent);display:block}
.seg.now{box-shadow:0 0 0 2px var(--ink)}
.tip{width:20px;background:var(--red);border-radius:3px}
.belt-cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.sess-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.meta{color:var(--muted);font-size:14px;margin-top:8px}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
details.warm{margin-top:12px;font-size:14px;color:var(--muted)}
details.warm summary{cursor:pointer;color:var(--ink);font-weight:600;min-height:32px}

/* exercícios (hoje) */
details.ex{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.ex:first-of-type{border-top:0;padding-top:0}
details.ex>summary{list-style:none;display:flex;gap:10px;align-items:baseline;cursor:pointer;min-height:44px;align-content:center}
details.ex>summary::-webkit-details-marker{display:none}
.ex-name{font-weight:600;font-size:17px;line-height:1.25;flex:1}
.target{font-family:var(--font-d);font-weight:700;font-size:22px;white-space:nowrap;color:var(--accent)}
.eb{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.eb.full{background:var(--ok-soft);color:var(--ok)}
.ex-note{font-size:13px;color:var(--muted);margin-top:2px}
.last{font-size:13px;color:var(--muted);margin-top:2px}
.srow{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px;padding:4px 6px 4px 4px;border-radius:12px}
.srow.one{grid-template-columns:26px 1fr 48px}
.srow.on{background:var(--ok-soft)}
.sn{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.fld{position:relative;display:block}
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 40px 0 12px;font-size:17px;font-weight:600;text-align:center;-moz-appearance:textfield}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.srow.on .inp{background:var(--surface)}
.unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent}
.chk svg{width:22px;height:22px}
.srow.on .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.addset{margin-top:8px;background:none;border:0;color:var(--accent);font-weight:600;padding:8px 4px;min-height:40px}
.addset.danger{color:var(--red)}
.nin{width:100%;height:40px;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:0 12px;font-size:14px;margin-top:8px}
textarea.nin{height:auto;min-height:76px;padding:10px 12px;resize:vertical;border-style:solid;background:var(--surface2)}

.btn{display:block;width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;margin-top:18px;text-align:center;text-decoration:none;line-height:1.2;padding:14px 12px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--ok);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.btn.sm{min-height:44px;font-size:15px;margin-top:10px;padding:10px 12px}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.feel button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:600;padding:2px}
.feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;min-height:52px}
.chk-item:first-of-type{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.box svg{width:16px;height:16px}
.chk-item[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk-item[aria-pressed="true"] span.t{color:var(--muted);text-decoration:line-through}
.summary{display:flex;gap:16px;margin-top:14px;padding:12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px;flex-wrap:wrap}
.summary b{font-family:var(--font-d);font-size:24px;margin-right:4px}

/* seletores e formulários */
.sel{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;font-size:16px}
.swap{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.swap span{flex:none}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-top:10px}
.row span{font-weight:600}
.f{display:block;margin-top:10px}
.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.f .tin{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:16px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri .tin{text-align:center}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg3 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* treinos (biblioteca) */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
.slist{margin-top:10px}
.scard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.scard h3{font-size:24px}
.scard .days{font-size:13px;color:var(--accent);font-weight:600;margin-top:6px}
.lrow{border-top:1px solid var(--line);padding:10px 0}
.lrow:first-of-type{border-top:0}
.lr-top{display:flex;gap:6px;align-items:center}
.lr-main{flex:1;text-align:left;background:none;border:0;padding:6px 0;min-height:44px}
.lr-main b{display:block;font-weight:600;line-height:1.25}
.lr-main small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1;padding:0}
.ib:disabled{opacity:.35}
.eform{background:var(--surface2);border-radius:12px;padding:4px 12px 14px;margin-top:6px}

/* calendário */
.wk{margin-top:14px}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk-title{font-family:var(--font-d);font-weight:700;font-size:22px}
.wk-range{color:var(--muted);font-size:14px;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 2px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.day .dw{font-size:11px;color:var(--muted)}
.day .dn{font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1}
.day .dl{font-size:11px;line-height:1.1;font-weight:600;overflow-wrap:anywhere}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day.rest{opacity:.6}
.wk-note{font-size:13px;color:var(--muted);margin-top:8px}

/* progresso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.stat b{font-family:var(--font-d);font-size:32px;line-height:1;display:block}
.stat b small{font-size:16px;color:var(--muted)}
.stat span{font-size:12px;color:var(--muted)}
.lift{padding:14px 0;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:0}
.lift-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lift-top b{font-weight:600}
.lift-top span{font-size:13px;color:var(--muted);text-align:right}
svg.chart{width:100%;height:auto;display:block;margin-top:6px}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--accent)}
.empty{color:var(--muted);font-size:14px;margin-top:6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mgrid label.full{grid-column:1 / -1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
.status{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
ul.g{margin:8px 0 0;padding-left:20px}
ul.g li{margin-top:6px}
textarea.bk{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:10px}

/* navegação, timer, aviso e confirmação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs a{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:30}
.timer[hidden]{display:none}
.timer .tm{font-family:var(--font-d);font-weight:700;font-size:30px;min-width:72px}
.timer .lbl{font-size:13px;opacity:.8;flex:1}
.timer button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid rgba(128,128,128,.5);background:transparent;color:inherit;font-weight:600;padding:0 10px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:40;font-size:15px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:44px;padding:0 6px}
.sheet{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.sheet>div{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet p{font-size:17px;font-weight:600}
/* dieta */
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg4 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;padding:0 4px}
.seg4 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.focus{border-left:4px solid var(--accent)}
.focus h2{margin-top:2px}
.why{font-size:14px;color:var(--muted);margin-top:10px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.dnav div{text-align:center}
.dnav b{font-family:var(--font-d);font-size:26px;display:block;line-height:1}
.dnav span{font-size:13px;color:var(--muted)}
.bar-row{margin-top:14px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.bar-top b{font-family:var(--font-d);font-size:22px}
.bar-top small{font-family:var(--font-b);font-size:13px;color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meal.skipped{opacity:.6}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.picks button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:8px 10px}
.picks button b{font-family:var(--font-d);font-size:22px;line-height:1}
.picks button span{font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.picks button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt-mac{font-size:13.5px;color:var(--muted);margin-top:12px}
.opt-mac b{color:var(--ink)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:6px}
.two .btn{margin-top:10px}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper span{font-family:var(--font-d);font-weight:700;font-size:26px;min-width:64px;text-align:center}
.stepper small{font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:500}
details.rec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;min-height:44px}
details.rec>summary::-webkit-details-marker{display:none}
details.rec .rt{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.1}
details.rec h4{font-size:13px;color:var(--muted);margin:14px 0 0;text-transform:none;font-weight:700}
ol.g{margin:8px 0 0;padding-left:22px}
ol.g li{margin-top:6px}
.dietlink{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px}
.dietlink span:last-child{color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .srow,.chk,.seg i,.bar i{transition:background-color .15s,border-color .15s,width .25s} }
</style>
</head>
<body>
<div class="app" id="app"><div id="view"></div></div>
<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <span class="tm" id="tm">0:00</span><span class="lbl">Descanso</span>
  <button type="button" data-act="tadd" data-v="-15" aria-label="Menos 15 segundos">−15</button>
  <button type="button" data-act="tadd" data-v="15" aria-label="Mais 15 segundos">+15</button>
  <button type="button" data-act="tstop">Pular</button>
</div>
<div class="toast" id="toast" hidden role="status"><span id="toast-msg"></span><button type="button" id="toast-undo" hidden>Desfazer</button></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-msg">
  <div><p id="sheet-msg"></p>
    <button type="button" class="btn danger" id="sheet-ok" data-act="sheetok">Confirmar</button>
    <button type="button" class="btn ghost sm" data-act="sheetno">Cancelar</button>
  </div>
</div>
<nav class="tabs" aria-label="Seções">
  <a href="#hoje" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg>Hoje</a>
  <a href="#calendario" data-tab="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</a>
  <a href="#treinos" data-tab="treinos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Treinos</a>
  <a href="#dieta" data-tab="dieta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Dieta</a>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
var DAYMS=86400000;
var MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAL=['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
var DIAC=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function $(id){return document.getElementById(id);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromIso(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);}
function dm(d){return d.getDate()+'/'+(d.getMonth()+1);}
function todayIso(){return iso(new Date());}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return 'x'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ================= plano padrão ================= */
// m = tipo de registro: kg (carga e repetições), bw (peso do corpo + carga extra), rep (só repetições), s (só segundos), kgs (carga e segundos)
function X(n,s,r,m,t,rest){return {n:n,s:s,r:Array.isArray(r)?r:[r,r,r],m:m,t:t,rest:rest};}
function defaultPlan(){
  return {
    ex:{
      supino:X('Supino com halteres',[4,5,5],['5–8','4–6','3–5'],'kg','Pegada neutra ou semi-pronada. Principal do dia.',150),
      remada_a:X('Remada curvada ou apoiada no banco',[3,4,4],['6–8','4–6','3–5'],'kg','Coluna neutra, sem balançar.',150),
      press_a:X('Landmine press ou press sentado',[3,3,3],['6–10','5–8','5–8'],'kg','Pegada neutra, amplitude sem dor no ombro.',120),
      barra:X('Barra fixa, pegada neutra',[3,3,3],['5–8','5–8','3–6'],'bw','Carga extra em kg (0 é o peso do corpo). Use elástico se não chegar a 5.',120),
      lat_a:X('Elevação lateral com halteres',[3,4,3],'10–15','kg','Pare com 1 a 2 repetições na reserva.',60),
      face:X('Face pull na polia',[3,3,3],'12–15','kg','Pausa de 1 s na contração.',60),
      rosca_a:X('Rosca direta com halteres',[2,3,2],'8–12','kg','Superset com o tríceps.',45),
      tri_a:X('Tríceps na polia',[2,3,2],'8–12','kg','Superset com a rosca.',60),
      pallof:X('Pallof press (core)',[3,3,3],'10 por lado','kg','Sem girar o tronco.',45),
      farmer:X('Farmer’s walk (pegada)',[2,2,2],'30–40 s','kgs','Pesado, ombros para baixo. Carga em kg por mão.',60),
      puxada:X('Puxada na frente, pegada aberta',[3,4,3],'8–12','kg','Puxe com o cotovelo, sem balançar.',90),
      inclinado:X('Supino inclinado com halteres',[3,4,3],'8–12','kg','Banco a 30 graus.',90),
      press_b:X('Press de ombros sentado',[3,3,2],'8–12','kg','Pegada neutra, cotovelos levemente à frente.',90),
      remada_b:X('Remada unilateral ou remada baixa',[3,3,2],'8–12','kg','Pausa de 1 s no final.',90),
      cruc:X('Crucifixo no peck deck ou nas polias',[2,3,2],'10–15','kg','Alongamento controlado.',60),
      lat_b:X('Elevação lateral na polia',[3,4,3],'12–20','kg','Superset com o crucifixo inverso.',45),
      inverso:X('Crucifixo inverso',[3,3,2],'12–15','kg','Foco no deltoide posterior.',45),
      rosca_b:X('Rosca alternada ou barra W',[3,4,3],'8–12','kg','Superset com o tríceps.',45),
      tri_b:X('Tríceps francês ou na corda',[3,4,3],'8–12','kg','Cotovelos fixos.',60),
      joelhos:X('Elevação de joelhos ou pernas na barra (core)',[3,4,3],'8–15','rep','Incline a pelve, sem balançar.',60),
      pescoco:X('Isometria de pescoço, 4 direções',[2,2,2],'20 s','s','Leve, 30 a 40% do esforço.',30),
      salto_l:X('Salto vertical ou box jump',[2,3,4],'3','rep','Descansado, pouse macio.',120),
      agach:X('Agachamento com barra',[4,5,5],['5–8','4–6','3–5'],'kg','Box squat se o joelho incomodar. Principal do dia.',150),
      stiff:X('Stiff com barra ou halteres',[3,4,4],['6–10','5–8','5–8'],'kg','Coluna neutra, quadril para trás.',150),
      bulg:X('Agachamento búlgaro',[3,3,2],'8–10 por perna','kg','Amplitude sem dor no joelho.',90),
      nordic:X('Nordic curl assistido (ou mesa flexora)',[3,3,2],'4–8','rep','Desça devagar, 3 a 4 s.',90),
      hip_l:X('Hip thrust com barra',[2,3,2],'8–10','kg','Pausa de 1 s no topo.',90),
      pant_pe:X('Panturrilha em pé',[3,4,3],'8–12','kg','Pausa de 1 s embaixo.',60),
      roll:X('Roll-out com roda ou barra (core)',[3,3,3],'8–12','rep','Lombar sem arquear.',60),
      copen_l:X('Copenhagen plank (adutores)',[2,2,2],'20–30 s por lado','s','Versão com joelho se for forte demais.',45),
      salto_b:X('Salto vertical ou box jump',[3,3,4],'3','rep','Descansado, pouse macio.',120),
      hip_b:X('Hip thrust com barra',[3,4,3],'8–10','kg','Pausa de 1 s no topo.',90),
      leg:X('Leg press, pés na altura média',[3,3,3],'10–12','kg','Sem tirar o quadril do banco.',90),
      afundo:X('Afundo ou step-up',[2,3,2],'10 por perna','kg','Passo controlado.',75),
      mesa:X('Mesa flexora',[3,3,3],'10–15','kg','Volta lenta.',75),
      pant_sent:X('Panturrilha sentada',[3,4,3],'12–15','kg','Pausa de 1 s embaixo.',60),
      med:X('Arremesso rotacional de medicine ball (core)',[3,3,3],'5 por lado','rep','Gire o quadril, sem forçar a lombar.',60),
      copen_b:X('Copenhagen plank (adutores)',[2,2,2],'20–30 s por lado','s','Versão com joelho se for forte demais.',45)
    },
    sess:{
      UA:{name:'Upper A',sub:'Força: peito, costas e ombros',min:'70 a 80 min',ex:['supino','remada_a','press_a','barra','lat_a','face','rosca_a','tri_a','pallof','farmer']},
      UB:{name:'Upper B',sub:'Hipertrofia: ombros, braços, costas e peito',min:'70 a 80 min',ex:['puxada','inclinado','press_b','remada_b','cruc','lat_b','inverso','rosca_b','tri_b','joelhos','pescoco']},
      LW:{name:'Lower',sub:'Força e hipertrofia: pernas e core',min:'75 a 90 min',ex:['salto_l','agach','stiff','bulg','nordic','hip_l','pant_pe','roll','copen_l']},
      LB:{name:'Lower B (opcional)',sub:'Só em semana sem vôlei',min:'65 a 75 min',ex:['salto_b','hip_b','leg','afundo','mesa','pant_sent','med','copen_b']}
    },
    order:['UA','UB','LW','LB'],
    alt:'LB',
    cond:['Mobilidade: 90/90 de quadril, rotação torácica e peitoral (8 min)','Rotação externa de ombro com halter leve: 3 × 12–15 por lado','Y, T e W no banco inclinado: 2 × 8 de cada','Wall slide para o serrátil: 2 × 10','Dead bug: 3 × 8 por lado','Bird dog: 3 × 8 por lado','Cardio leve em ritmo de conversa: 20 a 30 min']
  };
}
function defaultSched(){return [{k:'bjj',gi:true},{k:'gym',s:'LW'},{k:'gym',s:'UA'},{k:'bjj',gi:false},{k:'gym',s:'UB'},{k:'volei'},{k:'rest'}];}
var RIR=['3','2–3','2','4','2','1–2','1–2','4','2','1–2','1–2','4'];
var DELOAD=[3,7,11];
var WEEKNOTE={5:'Natal: se faltar tempo, faça só os exercícios principais.',6:'Réveillon: mesma regra da semana anterior.',11:'Semana de testes: 1 série de 3 a 5 repetições com RIR 1 nos exercícios testados, depois metade das séries.'};
var DAYNOTE={'11-1':'Teste de agachamento hoje.','11-2':'Teste de supino, remada e barra fixa hoje.','11-4':'Tire medidas e fotos hoje (aba Progresso).'};
var DEFAULT_START='2026-11-16';

/* ================= estado ================= */
var KEY='treino12-v2',KEY1='treino12-v1';
function blank(){return {v:2,ts:0,start:DEFAULT_START,plan:defaultPlan(),sched:defaultSched(),log:{},done:{},feel:{},over:{},cond:{},meas:{},notes:{},diet:{}};}
function normalize(o){
  var b=blank();
  if(!o||typeof o!=='object')return b;
  ['ts','start','plan','sched','log','done','feel','over','cond','meas','notes','diet'].forEach(function(k){if(o[k]!==undefined&&o[k]!==null)b[k]=o[k];});
  if(o.opt&&typeof o.opt==='object'){Object.keys(o.opt).forEach(function(d){if(o.opt[d]&&!b.over[d])b.over[d]=b.plan.alt||'LB';});}
  ['log','done','feel','over','cond','meas','notes','diet'].forEach(function(k){if(typeof b[k]!=='object'||Array.isArray(b[k]))b[k]={};});
  if(typeof b.ts!=='number')b.ts=0;
  if(typeof b.start!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(b.start))b.start=DEFAULT_START;
  var p=b.plan;
  if(!p||typeof p!=='object'||!p.ex||!p.sess)b.plan=defaultPlan();
  else{
    if(!Array.isArray(p.order))p.order=Object.keys(p.sess);
    p.order=p.order.filter(function(id){return p.sess[id];});
    Object.keys(p.sess).forEach(function(id){if(p.order.indexOf(id)<0)p.order.push(id);var s=p.sess[id];if(!Array.isArray(s.ex))s.ex=[];s.ex=s.ex.filter(function(e){return p.ex[e];});});
    if(!Array.isArray(p.cond))p.cond=defaultPlan().cond;
    if(!p.alt||!p.sess[p.alt])p.alt=p.order[p.order.length-1]||'';
    Object.keys(p.ex).forEach(function(id){var e=p.ex[id];if(!Array.isArray(e.s)||e.s.length<3)e.s=[3,3,3];if(!Array.isArray(e.r)||e.r.length<3)e.r=['8–12','8–12','8–12'];if(['kg','bw','rep','s','kgs'].indexOf(e.m)<0)e.m='kg';if(typeof e.rest!=='number')e.rest=90;});
  }
  if(!Array.isArray(b.sched)||b.sched.length!==7)b.sched=defaultSched();
  return b;
}
var state=(function(){
  try{var s=localStorage.getItem(KEY);if(s)return normalize(JSON.parse(s));}catch(e){}
  try{var s1=localStorage.getItem(KEY1);if(s1)return normalize(JSON.parse(s1));}catch(e){}
  return blank();
})();
var sync='local',ref=null,saving=false,dirty=false,saveT=null;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function touch(){state.ts=Date.now();saveLocal();queueRemote();}
function queueRemote(){if(!ref)return;clearTimeout(saveT);saveT=setTimeout(flush,900);}
function flush(){
  if(!ref)return;
  if(saving){dirty=true;return;}
  saving=true;
  var p;
  try{p=ref.set(clone(state));}catch(e){saving=false;return;}
  Promise.resolve(p).then(function(){sync='cloud';}).catch(function(){sync='error';}).then(function(){saving=false;updateStatus();if(dirty){dirty=false;queueRemote();}});
}
function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user)return null;
      return Promise.resolve(user.id()).then(function(uid){
        if(!uid)return null;
        ref=db.doc('data/users/'+uid+'/treino');
        ref.onSnapshot(function(snap){
          if(snap.exists){
            var rem=snap.data()||{};var rts=typeof rem.ts==='number'?rem.ts:0;
            if(rts>state.ts){state=normalize(clone(rem));setStart();saveLocal();render();}
            else if(state.ts>rts){queueRemote();}
          }else if(state.ts>0){queueRemote();}
          sync='cloud';updateStatus();
        },function(){sync='local';updateStatus();});
      });
    }).catch(function(){});
  }catch(e){}
}
function statusText(){return sync==='cloud'?'Salvo na sua conta e sincronizado entre aparelhos.':(sync==='error'?'Não foi possível sincronizar agora. Seus dados continuam salvos neste aparelho.':'Salvo só neste aparelho. Use o backup em Mais para guardar uma cópia.');}
function updateStatus(){var el=$('status');if(el)el.textContent=statusText();}

/* ================= datas do plano ================= */
var START=null;
function setStart(){var d=fromIso(state.start);START=addDays(d,-((d.getDay()+6)%7));}
setStart();
function idxOf(s){return Math.round((fromIso(s)-START)/DAYMS);}
function dowOf(s){return (fromIso(s).getDay()+6)%7;}
function longDate(s){var d=fromIso(s);return DIAL[dowOf(s)]+', '+d.getDate()+' de '+MESL[d.getMonth()];}
function weekRange(w){var a=addDays(START,w*7),b=addDays(a,6);return a.getMonth()===b.getMonth()?a.getDate()+'–'+dm(b):dm(a)+'–'+dm(b);}
function startLabel(){return dm(START);}

/* ================= consultas do plano ================= */
function SESS(id){return state.plan.sess[id];}
function EX(id){return state.plan.ex[id];}
function info(date){
  var i=idxOf(date);
  if(i<0)return {phase:'pre',i:i};
  if(i>=84)return {phase:'end',i:i};
  var w=Math.floor(i/7),d=i%7;
  var o={phase:'plan',i:i,w:w,dow:d,block:w<4?0:(w<8?1:2),deload:DELOAD.indexOf(w)>=0,rir:RIR[w]};
  var s=state.sched[d];for(var k in s)o[k]=s[k];
  if(o.k==='gym'&&!SESS(o.s))o.k='rest';
  return o;
}
function sessKey(date,f){
  var ov=state.over[date];if(ov&&SESS(ov))return ov;
  if(f.k==='gym'&&SESS(f.s))return f.s;
  return null;
}
function targetSets(ex,f){var n=clamp(parseInt(EX(ex).s[f.block],10)||1,1,12);return f.deload?Math.max(1,Math.ceil(n/2)):n;}
function targetReps(ex,f){return EX(ex).r[f.block]||'';}
function dayLabel(f,date){
  if(f.phase!=='plan')return '';
  var k=sessKey(date,f);
  if(k)return SESS(k).name;
  if(f.k==='bjj')return f.gi?'Gi':'No-gi';
  if(f.k==='volei')return 'Vôlei';
  return 'Livre';
}
function counted(f){return f.k==='gym'||f.k==='bjj';}
function weekTotal(w){var n=0;for(var d=0;d<7;d++){var f=info(iso(addDays(START,w*7+d)));if(counted(f))n++;}return n;}
function weekDone(w){var n=0;for(var d=0;d<7;d++){var dd=iso(addDays(START,w*7+d));if(counted(info(dd))&&state.done[dd])n++;}return n;}
function modeOf(ex){var m=EX(ex).m;return {kg:m==='kg'||m==='bw'||m==='kgs',ru:(m==='s'||m==='kgs')?'s':'reps',ku:m==='bw'?'+kg':'kg'};}

/* ================= registro ================= */
function getSets(date,ex){var d=state.log[date];return (d&&d[ex])||[];}
function setField(date,ex,i,key,val){
  var d=state.log[date]||(state.log[date]={});
  var a=d[ex]||(d[ex]=[]);
  while(a.length<=i)a.push({});
  var o={};for(var k in a[i])o[k]=a[i][k];o[key]=val;a[i]=o;
  touch();
}
function prevFor(ex,i,date){
  var dates=Object.keys(state.log).sort().reverse();
  for(var j=0;j<dates.length;j++){
    if(dates[j]>=date)continue;
    var a=state.log[dates[j]][ex];
    if(!a||!a.length)continue;
    var s=a[i]||a[a.length-1];
    if(s&&(s.kg||s.reps))return {kg:s.kg||'',reps:s.reps||'',date:dates[j]};
  }
  return {kg:'',reps:'',date:''};
}
function getNote(date,k){var n=state.notes[date];return (n&&n[k])||'';}
function setNote(date,k,v){var n=state.notes[date]||(state.notes[date]={});if(v)n[k]=v;else delete n[k];if(!Object.keys(n).length)delete state.notes[date];touch();}
function prevNote(ex,date){
  var ds=Object.keys(state.notes).sort().reverse();
  for(var i=0;i<ds.length;i++){if(ds[i]<date&&state.notes[ds[i]][ex])return state.notes[ds[i]][ex];}
  return '';
}

/* ================= navegação ================= */
var VIEWS=['hoje','calendario','treinos','dieta','progresso','mais'];
var view='hoje',sel=todayIso();
var lib={sid:null,open:null,cond:false};
function route(){var h=(location.hash||'').replace('#','');var v=VIEWS.indexOf(h)>=0?h:'hoje';var ch=v!==view;view=v;if(ch){lib.sid=null;lib.open=null;lib.cond=false;}render();if(ch)window.scrollTo(0,0);}

/* ================= componentes ================= */
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function belt(){
  var cur=idxOf(todayIso());var cw=cur<0?-1:Math.min(11,Math.floor(cur/7));
  var h='<div class="belt" role="img" aria-label="Progresso das 12 semanas">';
  var done=0,tot=0;
  for(var w=0;w<12;w++){var t=weekTotal(w),d=weekDone(w);done+=d;tot+=t;h+='<div class="seg'+(w===cw?' now':'')+'"><i style="width:'+(t?d/t*100:0)+'%"></i></div>';}
  h+='<div class="tip"></div></div>';
  var cap=cur<0?'Começa em '+startLabel():(cur>=84?'Plano concluído':'Semana '+(cw+1)+' de 12');
  h+='<div class="belt-cap"><span>'+cap+'</span><span>'+done+' de '+tot+' treinos e aulas</span></div>';
  return h;
}
function phaseChip(f){
  if(f.phase==='pre')return '<span class="chip">Pré-semana</span>';
  if(f.phase==='end')return '<span class="chip ok">Concluído</span>';
  return '<span class="chip'+(f.deload?' amber':'')+'">Semana '+(f.w+1)+' · '+(f.deload?'Deload':'Bloco '+(f.block+1))+' · RIR '+f.rir+'</span>';
}
function opts(list,selv){return list.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===selv?' selected':'')+'>'+esc(x[1])+'</option>';}).join('');}
function schedOptions(selv){
  var l=[['gi','Jiu-jitsu com kimono'],['nogi','Jiu-jitsu sem kimono'],['volei','Vôlei de praia'],['rest','Descanso']];
  state.plan.order.forEach(function(id){l.push(['s:'+id,SESS(id).name]);});
  return opts(l,selv);
}
function schedVal(it){return it.k==='bjj'?(it.gi?'gi':'nogi'):(it.k==='gym'?'s:'+it.s:it.k);}
function swapSelect(date,f,label){
  var cur=state.over[date]||'';
  var l=[['',label]];state.plan.order.forEach(function(id){l.push([id,SESS(id).name]);});
  return '<label class="swap"><span>Trocar treino de hoje</span><select class="sel" data-ch="swap" aria-label="Trocar treino de hoje">'+opts(l,cur)+'</select></label>';
}

/* ================= HOJE ================= */
function viewHoje(){
  var date=sel,f=info(date),t=todayIso();
  var h='<header><h1>'+(date===t?'Hoje':DIAC[dowOf(date)])+'</h1><p class="lead">'+longDate(date)+'</p><p style="margin-top:10px">'+phaseChip(f)+'</p></header>';
  h+=belt();
  h+=dietLink(date);
  if(date!==t)h+='<button type="button" class="btn ghost sm" data-act="gotoday">Voltar para hoje</button>';
  if(f.phase==='pre')return h+cardPre(date);
  if(f.phase==='end')return h+cardEnd();
  var key=sessKey(date,f);
  if(key)return h+cardGym(date,f,key);
  if(f.k==='bjj')return h+cardBjj(date,f);
  if(f.k==='volei')return h+cardVolei(date,f);
  return h+cardRest(date,f);
}
function cardPre(date){
  var on=!!state.done[date];
  return '<section class="card"><h2>Reaquecimento</h2><p class="sub">Até '+dm(addDays(START,-1))+'</p>'+
  '<p style="margin-top:10px">Faça no máximo 1 ou 2 treinos leves de corpo inteiro, com 2 séries por exercício e 4 repetições na reserva. O objetivo é reaquecer as articulações antes da semana 1.</p>'+

/* ================= PROGRESSO ================= */
function liftSeries(ex){
  var pts=[],anyKg=false;
  Object.keys(state.log).sort().forEach(function(date){
    var a=state.log[date][ex];if(!a)return;
    var bestKg=0,rep=0,maxR=0,seen=false;
    a.forEach(function(s){
      if(!s.done&&!s.kg&&!s.reps)return;
      var kg=num(s.kg),rp=num(s.reps);seen=true;
      if(kg>bestKg||(kg===bestKg&&rp>rep)){bestKg=kg;rep=rp;}
      if(rp>maxR)maxR=rp;
    });
    if(seen){if(bestKg>0)anyKg=true;pts.push({date:date,kg:bestKg,reps:rep,maxR:maxR});}
  });
  return {pts:pts,kg:anyKg};
}
function chart(vals,label){
  var W=300,H=64,px=8,py=8;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn){mx+=1;mn-=1;}
  var pts=vals.map(function(v,i){return [px+(W-2*px)*i/(vals.length-1),H-py-(H-2*py)*(v-mn)/(mx-mn)];});
  var d=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var c=pts.map(function(p){return '<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>';}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'"><polyline class="ln" points="'+d+'"/>'+c+'</svg>';
}
function viewProg(){
  var gym=0,bjj=0,vol=0,gymTot=0,bjjTot=0;
  for(var i=0;i<84;i++){
    var dd=iso(addDays(START,i)),f=info(dd),k=sessKey(dd,f);
    if(k){gymTot+=(f.k==='gym'?1:0);if(state.done[dd])gym++;}

  var h='<header><h1>Progresso</h1><p class="lead">Seus números desde '+startLabel()+'.</p></header>';
  h+='<div class="stats"><div class="stat"><b>'+gym+'<small>/'+gymTot+'</small></b><span>academia</span></div><div class="stat"><b>'+bjj+'<small>/'+bjjTot+'</small></b><span>jiu-jitsu</span></div><div class="stat"><b>'+vol+'</b><span>vôlei</span></div></div>';
  h+='<section class="card"><h3>Cargas</h3><p class="sub">Melhor série de cada treino</p>';
  var list=[];
  Object.keys(state.plan.ex).forEach(function(ex){
    var m=EX(ex).m;if(m==='rep'||m==='s')return;
    var r=liftSeries(ex);if(r.pts.length)list.push({ex:ex,r:r,last:r.pts[r.pts.length-1].date});
  });
  list.sort(function(a,b){return a.last<b.last?1:-1;});
  if(!list.length)h+='<p class="empty">Registre cargas na aba Hoje para ver a evolução de cada exercício.</p>';
  list.slice(0,14).forEach(function(it){
    var pts=it.r.pts,useKg=it.r.kg,vals=pts.map(function(p){return useKg?p.kg:p.maxR;}),last=pts[pts.length-1],best=Math.max.apply(null,vals),u=useKg?' kg':' reps';
    var nm=EX(it.ex).n;
    h+='<div class="lift"><div class="lift-top"><b>'+esc(nm)+'</b><span>última '+(useKg?last.kg+' kg × '+last.reps:last.maxR+' reps')+' · melhor '+best+u+'</span></div>';
    h+=vals.length>1?chart(vals,nm+': '+vals.join(', ')+u):'<p class="empty">Registre mais um treino para ver a curva.</p>';
    h+='</div>';
  });
  h+='</section>';
  h+='<section class="card"><h3>Medidas</h3><p class="sub">Tire na semana 1, 4, 8 e 12. Peso em jejum, cintura na altura do umbigo.</p>';
  h+='<div class="mgrid"><label class="full"><input class="inp" type="date" id="md" value="'+todayIso()+'" aria-label="Data da medida" style="padding-right:12px"></label>';
  [['mp','Peso','kg'],['mc','Cintura','cm'],['mb','Braço','cm'],['mt','Coxa','cm']].forEach(function(x){h+='<label class="fld"><input class="inp" id="'+x[0]+'" inputmode="decimal" autocomplete="off" aria-label="'+x[1]+'" placeholder="'+x[1]+'"><span class="unit">'+x[2]+'</span></label>';});
  h+='</div><button type="button" class="btn sm" data-act="savemeas">Salvar medidas</button>';
  var ds=Object.keys(state.meas).sort();
  if(ds.length){
    var first=state.meas[ds[0]];

    ds.slice().reverse().forEach(function(d){
      var m=state.meas[d];
      var cell=function(k){if(!m[k])return '–';var v=num(m[k]);var df=first[k]&&d!==ds[0]?v-num(first[k]):null;return esc(m[k])+(df!==null&&df!==0?' <small style="color:var(--muted)">('+(df>0?'+':'')+df.toFixed(1).replace('.0','')+')</small>':'');};
      var dt=fromIso(d);
      h+='<tr><td>'+dt.getDate()+'/'+(dt.getMonth()+1)+'</td><td>'+cell('p')+'</td><td>'+cell('c')+'</td><td>'+cell('b')+'</td><td>'+cell('t')+'</td><td><button type="button" class="addset" style="margin:0;padding:4px" data-act="delmeas" data-date="'+d+'" aria-label="Apagar medida de '+dt.getDate()+'/'+(dt.getMonth()+1)+'">Apagar</button></td></tr>';
    });
    h+='</tbody></table></div><p class="sub" style="margin-top:8px">Os números entre parênteses mostram a diferença para a primeira medida.</p>';
  }
  h+='</section>';
  return h;

function dietTotals(date){

var tEnd=0,tInt=null;
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60);}
function startTimer(sec){tEnd=Date.now()+sec*1000;$('timer').hidden=false;tick();clearInterval(tInt);tInt=setInterval(tick,250);}
function stopTimer(){clearInterval(tInt);tInt=null;$('timer').hidden=true;}
function tick(){
  var left=(tEnd-Date.now())/1000;
  $('tm').textContent=fmt(left);
  if(left<=0){try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}stopTimer();}
}
var toastT=null,undoFn=null;
function toast(msg,undo){
  $('toast-msg').textContent=msg;undoFn=undo||null;$('toast-undo').hidden=!undo;$('toast').hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){$('toast').hidden=true;undoFn=null;},undo?6000:2600);
}
var pending=null;
function ask(msg,label,fn){$('sheet-msg').textContent=msg;$('sheet-ok').textContent=label||'Confirmar';pending=fn;$('sheet').hidden=false;}
function closeSheet(){$('sheet').hidden=true;pending=null;}

function saveFile(name,text){
  return Promise.resolve().then(function(){
    if(window.claude&&window.claude.use)return window.claude.use('downloads');
    return null;
  }).then(function(dl){
    if(dl){return dl.save({filename:name,data:new Blob([text],{type:'application/json'})}).then(function(){return true;});}
    var b=new Blob([text],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    return true;
  }).catch(function(){return false;});
}

  if(a==='opencond'){lib.cond=true;render();window.scrollTo(0,0);return;}
  if(a==='newsess'){var id=uid();state.plan.sess[id]={name:'Novo treino',sub:'',min:'60 min',ex:[]};state.plan.order.push(id);touch();lib.sid=id;lib.open=null;render();window.scrollTo(0,0);return;}
  if(a==='exopen'){lib.open=lib.open===b.dataset.ex?null:b.dataset.ex;render();return;}
  if(a==='exup'||a==='exdn'){
    var arr=SESS(lib.sid).ex,k=arr.indexOf(b.dataset.ex),k2=a==='exup'?k-1:k+1;
    if(k>=0&&k2>=0&&k2<arr.length){var tm=arr[k];arr[k]=arr[k2];arr[k2]=tm;touch();render();}
    return;
  }
  if(a==='exnew'){var nid=uid();state.plan.ex[nid]=X('Novo exercício',[3,3,3],'8–12','kg','',90);SESS(lib.sid).ex.push(nid);touch();lib.open=nid;render();return;}
  if(a==='exdel'){
    var exd=b.dataset.ex,sid=lib.sid;
    ask('Remover “'+EX(exd).n+'” deste treino? Seus registros antigos continuam salvos.','Remover',function(){
      var snap=clone(state.plan),arr2=SESS(sid).ex;arr2.splice(arr2.indexOf(exd),1);lib.open=null;touch();render();
      toast('Exercício removido',function(){state.plan=snap;touch();render();});
    });
    return;
  }
  if(a==='delsess'){
    var sd=b.dataset.id;
    ask('Excluir o treino “'+SESS(sd).name+'”? Dias da rotina que usam esse treino viram descanso. Seus registros antigos continuam salvos.','Excluir',function(){
      var snap=clone({plan:state.plan,sched:state.sched});
      delete state.plan.sess[sd];state.plan.order=state.plan.order.filter(function(x){return x!==sd;});
      state.sched=state.sched.map(function(it){return it.k==='gym'&&it.s===sd?{k:'rest'}:it;});
      if(state.plan.alt===sd)state.plan.alt=state.plan.order[state.plan.order.length-1]||'';
      lib.sid=null;touch();render();
      toast('Treino excluído',function(){state.plan=snap.plan;state.sched=snap.sched;touch();render();});
    });
    return;
  }
  if(a==='condnew'){state.plan.cond.push('Novo item');touch();render();return;}
  if(a==='conddel'){var ci=+b.dataset.i;state.plan.cond.splice(ci,1);state.cond={};touch();render();return;}
  /* backup e restauração */
  if(a==='bkdl'){saveFile('treino-backup-'+todayIso()+'.json',backupText()).then(function(ok){toast(ok?'Backup pronto':'Não foi possível baixar. Use Copiar backup.');});return;}
  if(a==='bkcopy'){
    var txt=backupText(),ta=$('bk');ta.value=txt;
    var done=function(){toast('Backup copiado');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){ta.select();toast('Selecione e copie o texto abaixo');});return;}}catch(e3){}
    ta.select();toast('Selecione e copie o texto abaixo');return;
  }
  if(a==='bkimport'){
    var raw=$('bk').value.trim();if(!raw){toast('Cole o backup primeiro');return;}
    var obj;try{obj=JSON.parse(raw);}catch(e4){toast('Backup inválido');return;}
    if(!obj||typeof obj!=='object'||!obj.v){toast('Backup inválido');return;}
    ask('Importar este backup? Ele substitui os treinos e registros atuais.','Importar',function(){state=normalize(obj);setStart();touch();render();toast('Backup importado');});
    return;
  }
  if(a==='resetplan'){ask('Voltar aos treinos e à rotina originais? Seus registros ficam como estão.','Restaurar',function(){state.plan=defaultPlan();state.sched=defaultSched();state.over={};touch();render();toast('Treinos originais restaurados');});return;}
  if(a==='resetlog'){ask('Apagar todos os registros de cargas, aulas, notas e medidas? Esta ação não pode ser desfeita.','Apagar',function(){state.log={};state.done={};state.feel={};state.cond={};state.meas={};state.notes={};state.over={};state.diet={};touch();render();toast('Registros apagados');});return;}
});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    if(!$('timer').hidden)tick();
  }
});

applyTheme();
route();
initRemote();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.top===window){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
})();
</script>
</body>
</html>
